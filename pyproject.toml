[tool.poetry]
name = "invenio-previewer-mirador"
version = "0.1.0"
description = "Invenio module that integrates the Mirador viewer..."
authors = ["TURATH <mwkhashoggi@fas.harvard.edu>"]
readme = "README.rst"
packages = [
    { include = "invenio_previewer_mirador" },
]
include = [
    "invenio_previewer_mirador/templates/**/*",
    "invenio_previewer_mirador/**/*.html",
]

[tool.poetry.dependencies]
python = "^3.9"
invenio-i18n = ">=2.0.0,<3.0.0"
invenio-previewer = ">=2.2.0,<3.0.0"
invenio-base = ">=1.3.0,<2.0.0"
invenio-app = ">=1.4.0,<2.0.0"
requests = "^2.31.0"
flask = ">=2.2.5"
flask-babel = ">=4.0.0"
autopep8 = "^2.3.1"
isort = "^5.13.2"
black = "^24.10.0"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
pytest-flask = "^1.2.0"
pytest-black = "^0.3.0"
pytest-pycodestyle = "^2.2.0"
pytest-pydocstyle = "^2.2.0"
pytest-isort = "^1.2.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
Sphinx = "^7.0.0"
sphinx-rtd-theme = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^24.10.0"
isort = "^5.13.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--verbose"
testpaths = ["tests"]

[tool.poetry.plugins."invenio_previewer.previewers"]
mirador = "invenio_previewer_mirador.previewer:mirador_previewer"

[tool.pycodestyle]
max-line-length = 120
ignore = ["E402", "W291", "W292", "E501"]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
